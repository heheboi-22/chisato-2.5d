server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json text/markdown;

    # PSDs and the page itself get replaced in place: always revalidate (cheap 304 if unchanged).
    location ~* \.(psd|html|json|md)$ {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # The OBS relay endpoints only exist in obs_server.py; answer quietly instead of logging 404s.
    location = /relay-info { access_log off; return 404; }

    location ~ /\. { deny all; }
}

# Serves the rig (rig/) on 127.0.0.1:8766. https://chisato.nadif.dev reaches it through the
# laptop's existing cloudflared (ingress chisato.nadif.dev -> http://localhost:8766).
#   docker compose up -d
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8766:80"
    volumes:
      - ./rig:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
